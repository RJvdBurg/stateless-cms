<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Theme Builder — Stateless CMS</title>
<meta name="robots" content="noindex, nofollow">
<style>
  :root{--pri:#3E2E6D;--pink:#f7588e;--bg:#f6f6f9;--card:#fff;--bd:#e6e6ef;--n5:#7a7a86;--n7:#3a3a44}
  *{box-sizing:border-box}
  body{margin:0;font-family:'Segoe UI',system-ui,Arial,sans-serif;background:var(--bg);color:var(--n7)}
  header.tb{display:flex;align-items:center;gap:12px;padding:10px 16px;background:#fff;border-bottom:1px solid var(--bd);position:sticky;top:0;z-index:10}
  header.tb .title{font-weight:700;color:var(--pri)}
  header.tb .sp{flex:1}
  .btn{border:1px solid var(--bd);background:#fff;border-radius:8px;padding:8px 12px;font-size:13px;cursor:pointer;color:var(--n7)}
  .btn:hover{border-color:#c9c9d6}
  .btn.pri{background:var(--pri);color:#fff;border-color:var(--pri)}
  .btn.pink{background:var(--pink);color:#fff;border-color:var(--pink)}
  .btn:disabled{opacity:.5;cursor:not-allowed}
  .wrap{display:grid;grid-template-columns:minmax(380px,460px) 1fr;gap:0;height:calc(100vh - 53px)}
  .panel{overflow:auto;padding:16px}
  .panel.form{border-right:1px solid var(--bd);background:#fafafd}
  .panel.prev{background:#eef0f4;padding:0;display:flex;flex-direction:column}
  .prevbar{padding:8px 12px;font-size:12px;color:var(--n5);border-bottom:1px solid var(--bd);background:#fff;display:flex;gap:10px;align-items:center}
  iframe#pv{flex:1;border:0;width:100%;background:#fff}
  fieldset{border:1px solid var(--bd);border-radius:10px;margin:0 0 14px;padding:12px 14px;background:var(--card)}
  legend{font-weight:700;font-size:13px;color:var(--pri);padding:0 6px}
  label.f{display:block;font-size:12px;color:var(--n5);margin:8px 0 3px}
  input[type=text],input[type=url],textarea,select{width:100%;padding:7px 9px;border:1px solid var(--bd);border-radius:7px;font-size:13px;font-family:inherit}
  textarea{resize:vertical;min-height:52px}
  .row{display:flex;gap:8px;align-items:center;margin:6px 0}
  .row input{flex:1}
  .row .grip{color:#bbb;font-size:12px}
  .mini{border:none;background:#f0f0f5;border-radius:6px;width:26px;height:26px;cursor:pointer;font-size:14px;color:#666;flex:0 0 auto}
  .mini:hover{background:#e5e5ee}
  .colorrow{display:flex;gap:8px;align-items:center;margin:6px 0}
  .colorrow input[type=color]{width:38px;height:30px;border:1px solid var(--bd);border-radius:6px;padding:0;background:#fff}
  .colorrow .lbl{flex:1;font-size:13px}
  .colorrow input[type=text]{width:96px;flex:0 0 auto}
  .sub{margin:6px 0 6px 18px;padding-left:10px;border-left:2px solid #eee}
  .hint{font-size:11px;color:#9a9aa6;margin-top:4px}
  .status{font-size:12px;padding:6px 10px;border-radius:7px;margin-left:8px}
  .status.ok{background:#e7f7ee;color:#1a7f43}.status.err{background:#fdecec;color:#c0392b}.status.info{background:#eef;color:#3a3a8a}
  .addbtn{font-size:12px;color:var(--pri);background:none;border:1px dashed #ccc;border-radius:7px;padding:5px 9px;cursor:pointer;margin-top:4px}
  .grp{font-size:12px;color:#888;margin:8px 0 2px;font-weight:600}
  .overlay{position:fixed;inset:0;background:rgba(20,20,30,.45);display:none;align-items:center;justify-content:center;z-index:50}
  .overlay.on{display:flex}
  .modal{background:#fff;border-radius:12px;padding:22px 24px;max-width:440px;width:90%;box-shadow:0 20px 60px rgba(0,0,0,.3)}
  .modal h3{margin:0 0 8px;color:var(--pri)}
  .modal input{margin:8px 0}
</style>
</head>
<body>
<header class="tb">
  <span class="title">🎨 Theme Builder</span>
  <span id="repoLbl" style="font-size:12px;color:#888"></span>
  <span class="sp"></span>
  <span id="status"></span>
  <button class="btn" id="btnSaveSite">💾 Bewaar site.json</button>
  <button class="btn" id="btnSaveTheme">🎨 Bewaar theme</button>
  <button class="btn pink" id="btnBake">🧱 Bak &amp; publiceer</button>
  <button class="btn" id="btnBack" title="Sluiten">✕</button>
</header>

<div class="wrap">
  <div class="panel form" id="form"><p style="color:#888">Laden…</p></div>
  <div class="panel prev">
    <div class="prevbar">Live preview <span id="pvnote" style="color:#bbb"></span></div>
    <iframe id="pv" title="preview"></iframe>
  </div>
</div>

<div class="overlay" id="patOverlay">
  <div class="modal">
    <h3>GitHub-token nodig</h3>
    <p style="font-size:13px;color:#555">Deze Theme Builder deelt je token met de CMS. Vul je fine-grained PAT in (blijft lokaal in je browser).</p>
    <input type="text" id="patInput" placeholder="github_pat_…" style="width:100%;padding:9px;border:1px solid #ddd;border-radius:8px">
    <div style="text-align:right;margin-top:10px"><button class="btn pri" id="patSave">Opslaan</button></div>
  </div>
</div>

<script>
/* ── Config (gedeeld met de CMS via dezelfde localStorage-sleutel) ────────── */
const CFG_KEY='scms_config_v1', OLD='vdb_cms_config_v1';
function loadCfg(){ try{ return JSON.parse(localStorage.getItem(CFG_KEY)||localStorage.getItem(OLD)||'{}'); }catch{ return {}; } }
function saveCfg(c){ localStorage.setItem(CFG_KEY, JSON.stringify(c)); }
let cfg = loadCfg();
const q = new URLSearchParams(location.search);
if(q.get('repo')) cfg.repo = q.get('repo').replace(/^https?:\/\/github\.com\//,'').replace(/\.git$/,'').replace(/\/+$/,'');
const REPO = cfg.repo || '';
const BRANCH = cfg.branch || 'main';

/* ── Base64 UTF-8 ─────────────────────────────────────────────────────────── */
function enc(str){const b=new TextEncoder().encode(str);let s='';const c=0x8000;for(let i=0;i<b.length;i+=c)s+=String.fromCharCode.apply(null,b.subarray(i,i+c));return btoa(s);}
function dec(b64){const bin=atob((b64||'').replace(/\s/g,''));const b=Uint8Array.from(bin,c=>c.charCodeAt(0));return new TextDecoder('utf-8').decode(b);}

/* ── GitHub ───────────────────────────────────────────────────────────────── */
async function gh(path,opts={}){
  const res=await fetch('https://api.github.com'+path,{...opts,headers:{'Authorization':`Bearer ${cfg.pat}`,'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28',...(opts.headers||{})}});
  if(!res.ok){let m='';try{m=(await res.json()).message||'';}catch{}throw new Error(`GitHub ${res.status}: ${m||res.statusText}`);}
  return res.status===204?null:res.json();
}
async function getFile(repo,path){ const d=await gh(`/repos/${repo}/contents/${path}?ref=${BRANCH}`); return {text:dec(d.content),sha:d.sha}; }
async function getFileRaw(repo,path){ return gh(`/repos/${repo}/contents/${path}?ref=${BRANCH}`); } // {content(base64), sha}
async function putFile(repo,path,text,msg,sha){ const body={message:msg,content:enc(text),branch:BRANCH};if(sha)body.sha=sha; return gh(`/repos/${repo}/contents/${path}`,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}); }
async function putB64(repo,path,b64,msg,sha){ const body={message:msg,content:b64,branch:BRANCH};if(sha)body.sha=sha; return gh(`/repos/${repo}/contents/${path}`,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}); }
async function fileSha(repo,path){ try{ return (await getFile(repo,path)).sha; }catch(e){ return undefined; } }
function mimeForExt(ext){ ext=(ext||'').toLowerCase(); return ext==='svg'?'image/svg+xml':(ext==='jpg'?'image/jpeg':'image/'+ext); }
async function readLogo(file){
  const ext=((file.name.split('.').pop())||'png').toLowerCase();
  if(ext==='svg'||file.type==='image/svg+xml'){ const t=await file.text(); const b=enc(t); return {ext:'svg',b64:b,mime:'image/svg+xml',dataUrl:'data:image/svg+xml;base64,'+b}; }
  const buf=await file.arrayBuffer(); const bytes=new Uint8Array(buf); let bin=''; for(let i=0;i<bytes.length;i+=0x8000)bin+=String.fromCharCode.apply(null,bytes.subarray(i,i+0x8000)); const b64=btoa(bin);
  const mime=file.type||mimeForExt(ext);
  return {ext,b64,mime,dataUrl:'data:'+mime+';base64,'+b64};
}

/* ── Afgeleide URLs ───────────────────────────────────────────────────────── */
function ownerRepo(){ const [o,r]=REPO.split('/'); return {o,r}; }
function sitePagesBase(){ const {o,r}=ownerRepo(); return `https://${o.toLowerCase()}.github.io/${r}/`; }
function themeRepoFrom(base){ try{ const u=new URL(base); const owner=u.hostname.split('.')[0]; const repo=u.pathname.replace(/^\/|\/$/g,'').split('/')[0]; return `${owner}/${repo}`; }catch{ return ''; } }

/* ── State ────────────────────────────────────────────────────────────────── */
let T=null;                 // window.Theme
let site={};                // site.json model
let siteSha=null;
let themeCss='';            // volledige theme.css tekst
let themeSha=null;
let themeBase='';
let themeRepo='';
let tokens={};              // {purple,pink,teal,g0,g1,g2,fdisplay,fbody,maxw}
let aiPrompt='';            // laatste AI-palet-beschrijving (blijft bij form-rebuild)
let aiReasoning='';         // korte toelichting van Gemini bij het laatste palet
let previewLogo='';         // dataURL-override voor instant logo-preview (header)
let previewLogoWhite='';    // idem (footer)

const $=s=>document.querySelector(s);
function setStatus(msg,type='info'){const e=$('#status');e.className='status '+type;e.textContent=msg;if(type==='ok')setTimeout(()=>{if(e.textContent===msg)e.textContent='';},4000);}

/* ── Theme.js als lib laden ───────────────────────────────────────────────── */
function loadThemeLib(base){return new Promise((res,rej)=>{window.THEME_LIB_ONLY=true;const s=document.createElement('script');s.src=base.replace(/\/?$/,'/')+'theme.js';s.onload=()=>res(window.Theme);s.onerror=()=>rej(new Error('theme.js laden mislukt'));document.head.appendChild(s);});}

/* ── theme.css tokens parsen / toepassen ──────────────────────────────────── */
function tok(css,name){const m=css.match(new RegExp('--'+name+':\\s*([^;]+);'));return m?m[1].trim():'';}
function gradStops(css){const g=tok(css,'grad');const hex=g.match(/#[0-9a-fA-F]{3,8}/g)||['#f7588e','#7b5ea7','#4ab9d8'];return hex;}
function hexToRgba(hex,a){let h=hex.replace('#','');if(h.length===3)h=h.split('').map(c=>c+c).join('');const n=parseInt(h,16);return `rgba(${(n>>16)&255},${(n>>8)&255},${n&255},${a})`;}
function parseTokens(css){const g=gradStops(css);return{purple:tok(css,'purple')||'#3E2E6D',pink:tok(css,'pink')||'#f7588e',teal:tok(css,'teal')||'#4ab9d8',g0:g[0],g1:g[1]||'#7b5ea7',g2:g[2]||g[1]||'#4ab9d8',fdisplay:tok(css,'fdisplay'),fbody:tok(css,'fbody'),maxw:tok(css,'maxw')};}
function applyTokens(css,t){
  css=css.replace(/--purple:\s*[^;]+;/,'--purple:'+t.purple+';');
  css=css.replace(/--pink:\s*[^;]+;/,'--pink:'+t.pink+';');
  css=css.replace(/--teal:\s*[^;]+;/,'--teal:'+t.teal+';');
  css=css.replace(/--grad:\s*[^;]+;/,'--grad:linear-gradient(135deg,'+t.g0+' 0%,'+t.g1+' 45%,'+t.g2+' 100%);');
  css=css.replace(/--grad-soft:\s*[^;]+;/,'--grad-soft:linear-gradient(135deg,'+hexToRgba(t.g0,.10)+','+hexToRgba(t.g1,.10)+' 45%,'+hexToRgba(t.g2,.10)+');');
  if(t.fdisplay)css=css.replace(/--fdisplay:\s*[^;]+;/,'--fdisplay:'+t.fdisplay+';');
  if(t.fbody)css=css.replace(/--fbody:\s*[^;]+;/,'--fbody:'+t.fbody+';');
  if(t.maxw)css=css.replace(/--maxw:\s*[^;]+;/,'--maxw:'+t.maxw+';');
  return css;
}

/* ── Lettertypen (curated Google Fonts die betrouwbaar laden) ─────────────── */
const FONTS = {
  'Inter':{q:'Inter:wght@400;500;600;700',cat:'sans'},
  'Poppins':{q:'Poppins:wght@400;500;600;700',cat:'sans'},
  'Montserrat':{q:'Montserrat:wght@400;500;600;700',cat:'sans'},
  'Work Sans':{q:'Work+Sans:wght@400;500;600;700',cat:'sans'},
  'DM Sans':{q:'DM+Sans:wght@400;500;700',cat:'sans'},
  'Raleway':{q:'Raleway:wght@400;500;600;700',cat:'sans'},
  'Nunito':{q:'Nunito:wght@400;600;700',cat:'sans'},
  'Nunito Sans':{q:'Nunito+Sans:wght@400;600;700',cat:'sans'},
  'Roboto':{q:'Roboto:wght@300;400;500;700',cat:'sans'},
  'Source Sans 3':{q:'Source+Sans+3:wght@400;600;700',cat:'sans'},
  'Space Grotesk':{q:'Space+Grotesk:wght@400;500;700',cat:'sans'},
  'Manrope':{q:'Manrope:wght@400;500;600;700',cat:'sans'},
  'Playfair Display':{q:'Playfair+Display:wght@400;600;700',cat:'serif'},
  'Merriweather':{q:'Merriweather:wght@400;700',cat:'serif'},
  'Lora':{q:'Lora:wght@400;500;600;700',cat:'serif'},
  'Roboto Slab':{q:'Roboto+Slab:wght@400;600;700',cat:'serif'},
  'DM Serif Display':{q:'DM+Serif+Display',cat:'serif'},
  'Libre Baskerville':{q:'Libre+Baskerville:wght@400;700',cat:'serif'},
  'Cormorant Garamond':{q:'Cormorant+Garamond:wght@400;500;600;700',cat:'serif'}
};
function fontName(v){ const m=(v||'').match(/^\s*'([^']+)'|^\s*"([^"]+)"|^\s*([^,]+)/); return ((m&&(m[1]||m[2]||m[3]))||'').trim(); }
function resolveFont(name){ if(!name) return null; const k=Object.keys(FONTS).find(f=>f.toLowerCase()===String(name).trim().toLowerCase()); return k||null; }
function fontStack(cat){ return cat==='serif' ? ", Georgia, serif" : ", 'Helvetica Neue', Arial, sans-serif"; }
/* Zet de lettertypen: werkt het @import in themeCss bij én de --fdisplay/--fbody-tokens. */
function setThemeFonts(displayName, bodyName){
  const d=FONTS[displayName], b=FONTS[bodyName], qs=[];
  if(d) qs.push(d.q); if(b && bodyName!==displayName) qs.push(b.q);
  if(qs.length){
    const imp="@import url('https://fonts.googleapis.com/css2?family="+qs.join('&family=')+"&display=swap');";
    if(/@import url\([^)]*\);/.test(themeCss)) themeCss=themeCss.replace(/@import url\([^)]*\);/, imp);
    else themeCss=imp+"\n"+themeCss;
  }
  if(displayName) tokens.fdisplay="'"+displayName+"'"+(d?fontStack(d.cat):", sans-serif");
  if(bodyName) tokens.fbody="'"+bodyName+"'"+(b?fontStack(b.cat):", sans-serif");
}

/* ── AI-kleurenpalet (Gemini) ─────────────────────────────────────────────── */
function normHex(v){ v=(v||'').trim(); if(/^[0-9a-fA-F]{6}$/.test(v))v='#'+v; return /^#[0-9a-fA-F]{6}$/.test(v)?v:null; }
async function geminiPalette(desc){
  if(!cfg.gemini) throw new Error('Geen Gemini-sleutel. Stel die in via de CMS (⚙ Instellingen → AI Co-pilot).');
  let model=cfg.model||'gemini-flash-latest';
  if(/gemini-(1\.|2\.5)|^gemini-pro$/i.test(model)) model='gemini-flash-latest';
  const url='https://generativelanguage.googleapis.com/v1beta/models/'+model+':generateContent?key='+encodeURIComponent(cfg.gemini);
  const schema={type:'object',properties:{
    primary:{type:'string'},accent:{type:'string'},secondary:{type:'string'},
    gradient:{type:'array',items:{type:'string'}},
    fontDisplay:{type:'string'},fontBody:{type:'string'},reasoning:{type:'string'}
  },required:['primary','accent','secondary','gradient']};
  const sys='Je bent een ervaren merk- en UI-designer. Genereer een samenhangend, toegankelijk kleurenpalet + lettertype-paar voor een website. '+
    'primary = diepe hoofdkleur (koppen/navigatie/tekst-accent), accent = opvallende kleur voor knoppen/CTA, '+
    'secondary = ondersteunende kleur. gradient = precies 3 hex-kleuren die vloeiend combineren (meestal accent → tussenkleur → secondary). '+
    'Gebruik altijd 6-cijferige hex (#rrggbb). Zorg voor voldoende contrast met een witte achtergrond, en witte tekst moet leesbaar zijn op accent. '+
    'fontDisplay = lettertype voor koppen, fontBody = lettertype voor lopende tekst (goed leesbaar). Kies BEIDE UITSLUITEND uit deze lijst, '+
    'exact zoals geschreven: '+Object.keys(FONTS).join(', ')+'. Combineer smaakvol (bijv. een expressieve display + een neutrale sans voor tekst). '+
    'Als er een logo-afbeelding is meegestuurd, baseer primary/accent/secondary vooral op de dominante kleuren daarin. '+
    'Houd reasoning tot max 1 korte zin.';
  const parts=[{text:'Beschrijving van het merk/de gewenste sfeer: '+(desc||'(geen beschrijving; gebruik het logo)')}];
  // Stuur het (raster)logo mee zodat het palet op de logokleuren wordt afgestemd (Gemini vision kan geen SVG lezen)
  try{
    if(site.logo){
      const ext=(site.logo.split('.').pop()||'').toLowerCase();
      const mime=mimeForExt(ext);
      if(mime!=='image/svg+xml'){
        const lf=await getFileRaw(REPO, site.logo);
        parts.push({text:'Hieronder het logo van het merk. Stem het palet af op de kleuren in dit logo:'});
        parts.push({inlineData:{mimeType:mime, data:(lf.content||'').replace(/\s/g,'')}});
      }
    }
  }catch(e){ /* geen/onleesbaar logo → tekst-only */ }
  const body={systemInstruction:{parts:[{text:sys}]},contents:[{role:'user',parts}],
    generationConfig:{responseMimeType:'application/json',responseSchema:schema,temperature:0.9}};
  const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  if(!r.ok){let m='';try{m=(await r.json()).error?.message||'';}catch{}throw new Error('Gemini '+r.status+(m?': '+m:''));}
  const data=await r.json();
  const txt=data.candidates?.[0]?.content?.parts?.[0]?.text||'';
  return JSON.parse(txt);
}
function applyPalette(p){
  const s=(k,v)=>{const h=normHex(v);if(h)tokens[k]=h;};
  s('purple',p.primary); s('pink',p.accent); s('teal',p.secondary);
  if(Array.isArray(p.gradient)){ s('g0',p.gradient[0]); s('g1',p.gradient[1]); s('g2',p.gradient[2]); }
  const rd=resolveFont(p.fontDisplay), rb=resolveFont(p.fontBody);
  if(rd || rb) setThemeFonts(rd || fontName(tokens.fdisplay), rb || fontName(tokens.fbody));
  aiReasoning=(p.reasoning||'').trim();
  buildForm(); renderPreview();
}
/* Logo uploaden (SVG/PNG/JPG) → naar assets/, pad in site.json, instant preview. */
async function uploadLogo(file, which){
  if(!file) return;
  try{
    setStatus('Logo verwerken…','info');
    const r=await readLogo(file);
    const path='assets/logo'+(which==='white'?'-white':'')+'.'+r.ext;
    if(which==='white') previewLogoWhite=r.dataUrl; else previewLogo=r.dataUrl;
    renderPreview();
    const sha=await fileSha(REPO, path);
    await putB64(REPO, path, r.b64, 'Upload '+path+' (Theme Builder)', sha);
    if(which==='white') site.logoWhite=path; else site.logo=path;
    await saveSite();   // pad meteen persistent in site.json (voorkomt "vergeten op te slaan")
    buildForm(); renderPreview();
    setStatus('Logo geüpload + opgeslagen ✓ — klik 🧱 Bak & publiceer om het op de pagina\'s te zetten.','ok');
  }catch(e){ setStatus('Upload mislukt: '+e.message,'err'); }
}

/* ── Live preview ─────────────────────────────────────────────────────────── */
function renderPreview(){
  if(!T)return;
  const cfgm=Object.assign({},T.DEFAULTS,site);
  if(previewLogo) cfgm.logo=previewLogo;
  if(previewLogoWhite) cfgm.logoWhite=previewLogoWhite;
  const css=applyTokens(themeCss,tokens);
  const header=T.headerOuterHTML(cfgm,'index.html').replace(/ onerror="[^"]*"/g,'');
  const footer=T.footerOuterHTML(cfgm);
  const wa=T.waOuterHTML(cfgm);
  const sample=`<main>
    <section class="hero-bg" style="background:var(--grad-soft);min-height:340px">
      <div class="hero-bg-inner container"><div class="hero-bg-text">
        <span class="label" style="color:var(--pink);font-weight:700;letter-spacing:.1em">VOORBEELD</span>
        <h1 style="font-family:var(--fdisplay);color:var(--purple);font-size:2.4rem;margin:.4rem 0">Voorbeeldkop <span class="grad-text">met accent</span></h1>
        <p class="lead">Zo ziet je huisstijl eruit. Pas kleuren, lettertype, menu en footer links aan.</p>
        <a class="btn btn-cta" style="display:inline-block;margin-top:1rem">Knop</a>
      </div></div>
    </section>
    <section class="section"><div class="container">
      <div class="stat-grid"><div><div class="stat-num" style="font-family:var(--fdisplay);color:var(--purple);font-size:2.2rem">300+</div><div>mensen</div></div>
      <div><div class="stat-num" style="font-family:var(--fdisplay);color:var(--purple);font-size:2.2rem">4.9</div><div>score</div></div>
      <div><div class="stat-num" style="font-family:var(--fdisplay);color:var(--purple);font-size:2.2rem">2500</div><div>uur</div></div></div>
    </div></section>
  </main>`;
  const doc=`<!DOCTYPE html><html><head><base href="${sitePagesBase()}"><style>${css}</style></head><body>${header}${sample}${footer}${wa}</body></html>`;
  $('#pv').srcdoc=doc;
}
let pvTimer=null;
function schedulePreview(){clearTimeout(pvTimer);pvTimer=setTimeout(renderPreview,180);}

/* ── Formulier-helpers ────────────────────────────────────────────────────── */
function el(tag,attrs,...kids){const e=document.createElement(tag);for(const k in (attrs||{})){if(k==='class')e.className=attrs[k];else if(k==='html')e.innerHTML=attrs[k];else if(k.startsWith('on'))e.addEventListener(k.slice(2),attrs[k]);else e.setAttribute(k,attrs[k]);}for(const c of kids){if(c==null)continue;e.append(c.nodeType?c:document.createTextNode(c));}return e;}
function input(val,on,ph){const i=el('input',{type:'text'});i.value=val==null?'':val;if(ph)i.placeholder=ph;i.addEventListener('input',()=>{on(i.value);schedulePreview();});return i;}
function textarea(val,on){const t=el('textarea');t.value=val==null?'':val;t.addEventListener('input',()=>{on(t.value);schedulePreview();});return t;}
function field(lbl,node){return el('div',{},el('label',{class:'f'},lbl),node);}
function miniBtn(txt,on){return el('button',{class:'mini',onclick:on},txt);}

/* Herhaalbare rij-editor voor arrays van objecten */
function listEditor(arr,cols,mk){
  const wrap=el('div',{});
  function redraw(){
    wrap.innerHTML='';
    arr.forEach((item,idx)=>{
      const row=el('div',{class:'row'});
      cols.forEach(c=>{
        const i=input(item[c.key],v=>{item[c.key]=v;},c.ph);
        if(c.w)i.style.flex='0 0 '+c.w;
        row.append(i);
      });
      row.append(miniBtn('▲',()=>{if(idx>0){arr.splice(idx-1,0,arr.splice(idx,1)[0]);redraw();schedulePreview();}}));
      row.append(miniBtn('✕',()=>{arr.splice(idx,1);redraw();schedulePreview();}));
      wrap.append(row);
      if(mk)mk(item,wrap);
    });
    const add=el('button',{class:'addbtn',onclick:()=>{const o={};cols.forEach(c=>o[c.key]='');arr.push(o);redraw();schedulePreview();}},'+ toevoegen');
    wrap.append(add);
  }
  redraw();
  return wrap;
}

/* ── Formulier opbouwen ───────────────────────────────────────────────────── */
function buildForm(){
  const f=$('#form');f.innerHTML='';
  site.cta=site.cta||{};site.footer=site.footer||{};site.footer.contact=site.footer.contact||{};
  site.whatsapp=site.whatsapp||{};site.nav=site.nav||[];site.social=site.social||[];site.footer.columns=site.footer.columns||[];

  // Merk & logo
  const fsBrand=el('fieldset',{},el('legend',{},'Merk & logo'));
  fsBrand.append(field('Merknaam',input(site.brand,v=>site.brand=v)));
  const fileCss='width:100%;padding:6px;border:1px solid var(--bd);border-radius:7px;font-size:12px;margin:3px 0 6px;box-sizing:border-box;';
  const upLogo=el('input',{type:'file',accept:'image/*'}); upLogo.style.cssText=fileCss;
  upLogo.addEventListener('change',()=>{ if(upLogo.files[0]) uploadLogo(upLogo.files[0],'logo'); });
  fsBrand.append(field('Logo uploaden (SVG/PNG/JPG)',upLogo));
  fsBrand.append(field('Logo-pad',input(site.logo,v=>{site.logo=v;previewLogo='';},'assets/logo.svg')));
  const upLogoW=el('input',{type:'file',accept:'image/*'}); upLogoW.style.cssText=fileCss;
  upLogoW.addEventListener('change',()=>{ if(upLogoW.files[0]) uploadLogo(upLogoW.files[0],'white'); });
  fsBrand.append(field('Logo wit uploaden (footer, optioneel)',upLogoW));
  fsBrand.append(field('Logo-wit-pad',input(site.logoWhite,v=>{site.logoWhite=v;previewLogoWhite='';},'assets/logo-white.svg')));
  fsBrand.append(field('Logo alt-tekst',input(site.logoAlt,v=>site.logoAlt=v)));
  fsBrand.append(el('div',{class:'hint'},'Upload een logo (SVG/PNG/JPG) → het wordt meteen zichtbaar in de preview en geüpload. Klik daarna “Bak & publiceer”. Voor een PNG/JPG kiest de baker automatisch het juiste pad (bijv. assets/logo.png).'));
  f.append(fsBrand);

  // Kleuren & fonts
  const fsCol=el('fieldset',{},el('legend',{},'Kleuren & lettertypen'));
  function colorRow(lbl,key){
    const cr=el('div',{class:'colorrow'});
    const cp=el('input',{type:'color'});cp.value=/^#([0-9a-f]{6})$/i.test(tokens[key])?tokens[key]:'#000000';
    const tx=el('input',{type:'text'});tx.value=tokens[key]||'';
    cp.addEventListener('input',()=>{tokens[key]=cp.value;tx.value=cp.value;schedulePreview();});
    tx.addEventListener('input',()=>{tokens[key]=tx.value;if(/^#([0-9a-f]{6})$/i.test(tx.value))cp.value=tx.value;schedulePreview();});
    cr.append(cp,el('span',{class:'lbl'},lbl),tx);return cr;
  }
  // ✨ AI-kleurenpalet (Gemini)
  fsCol.append(el('div',{class:'grp'},'✨ AI-kleurenpalet (Gemini)'));
  const aiInput=el('input',{type:'text',placeholder:'bijv. warme, professionele golf-brand'});
  aiInput.value=aiPrompt; aiInput.style.cssText='width:100%;padding:7px 9px;border:1px solid var(--bd);border-radius:7px;font-size:13px;';
  aiInput.addEventListener('input',()=>{aiPrompt=aiInput.value;});
  const aiBtn=el('button',{class:'addbtn'},'✨ Genereer palet'); aiBtn.style.marginTop='6px';
  aiBtn.addEventListener('click',async()=>{
    if(!aiPrompt.trim()){setStatus('Beschrijf eerst je merk/sfeer.','err');return;}
    aiBtn.disabled=true; const t0=aiBtn.textContent; aiBtn.textContent='✨ Bezig…';
    try{ const p=await geminiPalette(aiPrompt); applyPalette(p); setStatus('AI-palet toegepast ✓ — sla op of gebruik “Bak & publiceer”.','ok'); }
    catch(e){ setStatus('AI mislukt: '+e.message,'err'); aiBtn.disabled=false; aiBtn.textContent=t0; }
  });
  fsCol.append(field('Beschrijf je merk / gewenste sfeer',aiInput), aiBtn);
  if(aiReasoning) fsCol.append(el('div',{class:'hint',style:'margin-top:6px'},'💬 '+aiReasoning));
  fsCol.append(el('div',{class:'grp'},'Hoofdkleuren'));
  fsCol.append(colorRow('Primair (paars)','purple'));
  fsCol.append(colorRow('Accent (roze)','pink'));
  fsCol.append(colorRow('Secundair (teal)','teal'));
  fsCol.append(el('div',{class:'grp'},'Gradient (3 stops)'));
  fsCol.append(colorRow('Stop 1','g0'));
  fsCol.append(colorRow('Stop 2 (midden)','g1'));
  fsCol.append(colorRow('Stop 3','g2'));
  fsCol.append(el('div',{class:'grp'},'Lettertypen'));
  const fontSelect=(current,onPick)=>{
    const sel=el('select',{}); sel.style.cssText='width:100%;padding:7px 9px;border:1px solid var(--bd);border-radius:7px;font-size:13px;';
    if(current && !FONTS[current]) sel.append(el('option',{value:current},current+' (huidig)'));
    Object.keys(FONTS).forEach(n=>sel.append(el('option',{value:n},n+' · '+FONTS[n].cat)));
    sel.value=current||''; sel.addEventListener('change',()=>onPick(sel.value)); return sel;
  };
  const curDisp=fontName(tokens.fdisplay), curBody=fontName(tokens.fbody);
  fsCol.append(field('Koppen (display)',fontSelect(curDisp,v=>{setThemeFonts(v,fontName(tokens.fbody));buildForm();renderPreview();})));
  fsCol.append(field('Tekst (body)',fontSelect(curBody,v=>{setThemeFonts(fontName(tokens.fdisplay),v);buildForm();renderPreview();})));
  fsCol.append(field('Max. site-breedte',input(tokens.maxw,v=>{tokens.maxw=v;},'1140px')));
  fsCol.append(el('div',{class:'hint'},'Kleuren/fonts worden opgeslagen in theme.css (theme-repo). Nieuwe fonts moeten in theme.css ge-@import worden.'));
  f.append(fsCol);

  // CTA (knop rechtsboven in de header)
  const fsCta=el('fieldset',{},el('legend',{},'Actieknop (rechtsboven)'));
  const ctaOn=!!(site.cta && site.cta.label);
  const ctaCb=el('input',{type:'checkbox'}); ctaCb.checked=ctaOn; ctaCb.style.cssText='margin-right:6px;vertical-align:middle;';
  const ctaLabel=input(site.cta.label,v=>site.cta.label=v);
  const ctaHref=input(site.cta.href,v=>site.cta.href=v,'contact.html');
  ctaLabel.disabled=!ctaOn; ctaHref.disabled=!ctaOn;
  ctaCb.addEventListener('change',()=>{
    if(ctaCb.checked){ if(!site.cta.label) site.cta.label='Contact'; ctaLabel.value=site.cta.label; }
    else { site.cta.label=''; }
    ctaLabel.disabled=ctaHref.disabled=!ctaCb.checked;
    schedulePreview();
  });
  fsCta.append(el('label',{style:'display:block;margin:2px 0 8px;font-size:13px;'},ctaCb,'Knop tonen'));
  fsCta.append(field('Tekst',ctaLabel));
  fsCta.append(field('Link',ctaHref));
  fsCta.append(el('div',{class:'hint'},'De knop staat vast rechtsboven in de header. Wil je de actie ergens anders? Zet deze uit en voeg een menu-item toe (Menu) of een CTA-sectie op de pagina (🧩 Secties in de CMS).'));
  f.append(fsCta);

  // Menu
  const fsNav=el('fieldset',{},el('legend',{},'Menu'));
  const navWrap=el('div',{});
  function drawNav(){
    navWrap.innerHTML='';
    site.nav.forEach((it,idx)=>{
      const row=el('div',{class:'row'});
      row.append(input(it.label,v=>{it.label=v;},'Label'));
      const hr=input(it.href,v=>{it.href=v;},'pagina.html');hr.style.flex='0 0 130px';row.append(hr);
      const subBtn=el('button',{class:'mini',title:'Submenu aan/uit',onclick:()=>{if(it.sub)delete it.sub;else it.sub=[];drawNav();schedulePreview();}},it.sub?'▼':'＋');
      row.append(subBtn);
      row.append(miniBtn('▲',()=>{if(idx>0){site.nav.splice(idx-1,0,site.nav.splice(idx,1)[0]);drawNav();schedulePreview();}}));
      row.append(miniBtn('✕',()=>{site.nav.splice(idx,1);drawNav();schedulePreview();}));
      navWrap.append(row);
      if(it.sub){
        const sub=el('div',{class:'sub'});
        it.sub.forEach((s,j)=>{
          const sr=el('div',{class:'row'});
          sr.append(input(s.label,v=>{s.label=v;},'Sub-label'));
          const shr=input(s.href,v=>{s.href=v;},'pagina.html');shr.style.flex='0 0 130px';sr.append(shr);
          sr.append(miniBtn('✕',()=>{it.sub.splice(j,1);drawNav();schedulePreview();}));
          sub.append(sr);
        });
        sub.append(el('button',{class:'addbtn',onclick:()=>{it.sub.push({label:'',href:''});drawNav();schedulePreview();}},'+ submenu-item'));
        navWrap.append(sub);
      }
    });
    navWrap.append(el('button',{class:'addbtn',onclick:()=>{site.nav.push({label:'',href:''});drawNav();schedulePreview();}},'+ menu-item'));
  }
  drawNav();fsNav.append(navWrap);f.append(fsNav);

  // Footer
  const fsFoot=el('fieldset',{},el('legend',{},'Footer'));
  fsFoot.append(field('Tagline',textarea(site.footer.tagline,v=>site.footer.tagline=v)));
  fsFoot.append(el('div',{class:'grp'},'Contact (NAP)'));
  fsFoot.append(field('Adres (één regel per zin)',textarea((site.footer.contact.address||[]).join('\n'),v=>site.footer.contact.address=v.split('\n').map(x=>x.trim()).filter(Boolean))));
  fsFoot.append(field('Telefoon',input(site.footer.contact.phone,v=>site.footer.contact.phone=v)));
  fsFoot.append(field('Telefoon-link (tel:)',input(site.footer.contact.phoneHref,v=>site.footer.contact.phoneHref=v,'tel:+31...')));
  fsFoot.append(field('E-mail',input(site.footer.contact.email,v=>site.footer.contact.email=v)));
  fsFoot.append(field('Onderregel',input(site.footer.bottom,v=>site.footer.bottom=v)));
  fsFoot.append(el('div',{class:'grp'},'Link-kolommen'));
  const colsWrap=el('div',{});
  function drawCols(){
    colsWrap.innerHTML='';
    site.footer.columns.forEach((col,ci)=>{
      const box=el('div',{class:'sub'});
      const head=el('div',{class:'row'});
      head.append(input(col.title,v=>{col.title=v;},'Kolomtitel'));
      head.append(miniBtn('✕',()=>{site.footer.columns.splice(ci,1);drawCols();schedulePreview();}));
      box.append(head);
      (col.links=col.links||[]).forEach((l,li)=>{
        const r=el('div',{class:'row'});
        r.append(input(l.label,v=>{l.label=v;},'Label'));
        const h=input(l.href,v=>{l.href=v;},'pagina.html');h.style.flex='0 0 120px';r.append(h);
        r.append(miniBtn('✕',()=>{col.links.splice(li,1);drawCols();schedulePreview();}));
        box.append(r);
      });
      box.append(el('button',{class:'addbtn',onclick:()=>{col.links.push({label:'',href:''});drawCols();schedulePreview();}},'+ link'));
      colsWrap.append(box);
    });
    colsWrap.append(el('button',{class:'addbtn',onclick:()=>{site.footer.columns.push({title:'',links:[]});drawCols();schedulePreview();}},'+ kolom'));
  }
  drawCols();fsFoot.append(colsWrap);f.append(fsFoot);

  // Social
  const fsSoc=el('fieldset',{},el('legend',{},'Social links'));
  fsSoc.append(listEditor(site.social,[{key:'label',ph:'Naam'},{key:'short',ph:'ic',w:'50px'},{key:'href',ph:'https://…'}]));
  f.append(fsSoc);

  // WhatsApp
  const fsWa=el('fieldset',{},el('legend',{},'WhatsApp-knop'));
  fsWa.append(field('Nummer (bijv. 31851249076)',input(site.whatsapp.number,v=>site.whatsapp.number=v)));
  fsWa.append(field('Standaardbericht',input(site.whatsapp.text,v=>site.whatsapp.text=v)));
  fsWa.append(field('Knoptekst',input(site.whatsapp.label,v=>site.whatsapp.label=v)));
  f.append(fsWa);
}

/* ── Opslaan / bakken ─────────────────────────────────────────────────────── */
function siteJsonText(){ return JSON.stringify(site,null,2)+'\n'; }
async function saveSite(){
  const r=await putFile(REPO,'site.json',siteJsonText(),'Theme Builder: update site.json',siteSha);
  siteSha=r.content.sha; return r;
}
async function saveTheme(){
  const newCss=applyTokens(themeCss,tokens);
  if(newCss===themeCss) return null;
  const r=await putFile(themeRepo,'theme.css',newCss,'Theme Builder: update design tokens',themeSha);
  themeCss=newCss; themeSha=r.content.sha; return r;
}
async function bakeAll(){
  const cfgm=Object.assign({},T.DEFAULTS,site);
  const tree=await gh(`/repos/${REPO}/git/trees/${BRANCH}?recursive=1`);
  const pages=(tree.tree||[]).filter(t=>t.type==='blob'&&/\.html$/i.test(t.path)).map(t=>t.path);
  let n=0;
  for(const p of pages){
    const f=await getFile(REPO,p);
    if(!/<main/i.test(f.text))continue;
    const out=T.bakePage(f.text,p.split('/').pop(),themeCss,cfgm);
    if(/vanderburg-theme|theme\.css|theme\.js/.test(out)||!/CMS:HEADER:START/.test(out)){setStatus('Sanity faalde: '+p,'err');continue;}
    await putFile(REPO,p,out,'Bake to flat HTML (Theme Builder)',f.sha);
    n++;setStatus(`Bakken… ${n}/${pages.length}`,'info');
  }
  return n;
}

/* ── Init ─────────────────────────────────────────────────────────────────── */
async function init(){
  if(!REPO){ $('#form').innerHTML='<p style="color:#c0392b">Geen repo. Open via de CMS (knop 🎨 Theme Builder) of voeg ?repo=owner/naam toe.</p>'; return; }
  $('#repoLbl').textContent=REPO+' @ '+BRANCH;
  if(!cfg.pat){ $('#patOverlay').classList.add('on'); return; }
  try{
    setStatus('Laden…','info');
    // cms.config.json → themeBase
    let themeBaseCfg='';
    try{ themeBaseCfg=JSON.parse((await getFile(REPO,'cms.config.json')).text).themeBase||''; }catch{}
    themeBase=(cfg.themeBase||themeBaseCfg||'').replace(/\/?$/,'/');
    if(!themeBase) throw new Error('Geen themeBase in cms.config.json.');
    themeRepo=themeRepoFrom(themeBase);
    // theme.js lib
    T=await loadThemeLib(themeBase);
    // theme.css (voor sha uit theme-repo; tekst is leidend)
    try{ const tf=await getFile(themeRepo,'theme.css'); themeCss=tf.text; themeSha=tf.sha; }
    catch(e){ themeCss=await fetch(themeBase+'theme.css').then(r=>r.text()); themeSha=null; setStatus('Let op: kan theme.css niet schrijven in '+themeRepo+' (token-scope?). site.json opslaan werkt wél.','err'); }
    tokens=parseTokens(themeCss);
    // site.json
    try{ const sf=await getFile(REPO,'site.json'); site=JSON.parse(sf.text); siteSha=sf.sha; }
    catch(e){ site=JSON.parse(JSON.stringify(T.DEFAULTS)); siteSha=null; }
    buildForm();
    renderPreview();
    setStatus('Klaar','ok');
  }catch(e){ setStatus(e.message,'err'); }
}

/* ── Events ───────────────────────────────────────────────────────────────── */
$('#btnBack').onclick=()=>window.close();
$('#patSave').onclick=()=>{const v=$('#patInput').value.trim();if(!v)return;cfg.pat=v;saveCfg(cfg);$('#patOverlay').classList.remove('on');init();};
$('#btnSaveSite').onclick=async()=>{try{setStatus('site.json opslaan…','info');await saveSite();setStatus('site.json opgeslagen ✓ — nog niet live: klik 🧱 Bak & publiceer','ok');}catch(e){setStatus(e.message,'err');}};
$('#btnSaveTheme').onclick=async()=>{try{setStatus('theme opslaan…','info');const r=await saveTheme();setStatus((r?'theme opgeslagen ✓':'geen theme-wijzigingen')+' — nog niet live: klik 🧱 Bak & publiceer','ok');}catch(e){setStatus('theme opslaan mislukt: '+e.message,'err');}};
$('#btnBake').onclick=async()=>{
  if(!confirm('Opslaan (site.json + theme) en alle pagina\'s opnieuw bakken tot platte HTML?'))return;
  try{
    setStatus('Opslaan…','info');
    await saveSite();
    try{ await saveTheme(); }catch(e){ setStatus('theme niet opgeslagen ('+e.message+'), ga door met bakken','err'); }
    setStatus('Bakken…','info');
    const n=await bakeAll();
    setStatus(`Klaar — ${n} pagina's gepubliceerd ✓`,'ok');
  }catch(e){ setStatus('Mislukt: '+e.message,'err'); }
};
init();
</script>
